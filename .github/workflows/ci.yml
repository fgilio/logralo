# CI for Logralo: a public personal repo on GitHub-hosted runners (public repos
# get unlimited GitHub-hosted minutes, so ubuntu-latest is the right call here).
#
# Laravel Cloud auto-deploys every push to `main`, so this workflow has no
# deploy job. Its role is to keep `main` deployable: it runs the same gates
# as Lefthook and Composer (lint, static analysis, type coverage, tests),
# then a single `ci-success` aggregate job. Point branch protection at
# `ci-success` only; adding or renaming a gate job never touches the
# protection rule, just keep the job in `ci-success`'s `needs:` list.
#
# Flux Pro auth: the repo is public, so auth.json is NOT committed. Each job
# that runs `composer install` writes the http-basic credentials from the
# FLUX_USERNAME and FLUX_LICENSE_KEY repository secrets first. Known
# limitation: fork PRs cannot read secrets, so `composer install` fails for
# external contributors until a maintainer reruns the workflow from a branch.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per ref. Superseded PR runs cancel for fast feedback. Runs on
  # `main` never cancel each other, so every commit gets a complete
  # `ci-success`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep in sync with the `php` constraint in composer.json and with
  # .github/php-version, which the cloud bootstrap and the snapshot workflow
  # read. The lint job asserts the two agree rather than trusting the comment:
  # a silent split means sandboxes provision one series while CI tests another.
  PHP_VERSION: "8.5"
  # Passed to every PHP setup step, including the one in cloud-snapshot.yml that
  # builds the binary sandboxes run. scripts/cloud/php.sh renders the same
  # directives into the restored binary's scan dir, so a sandbox is configured
  # like CI rather than merely running the same version.
  PHP_INI_VALUES: "memory_limit=512M, opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M"
  # Same list without the JIT directives, for the one job that loads a coverage
  # driver. pcov overrides zend_execute_ex, so PHP disables the JIT itself at
  # startup and prints a warning while doing it. Requesting the JIT there buys
  # no JIT and costs that warning on stdout — display_errors defaults there on
  # the CLI SAPI — from every php and composer invocation in the job, including
  # the ones whose output something else reads.
  #
  # php-ci-static keeps the warning out of its own version probe, so it no
  # longer fails the setup step outright. That is a narrower fix than it sounds:
  # it is scoped to that one command, and every other invocation still prints.
  # Merging the two lists back together is not what it enables.
  PHP_INI_VALUES_COVERAGE: "memory_limit=512M, opcache.enable_cli=1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the PHP pin matches .github/php-version
        run: |
          pinned="$(tr -d '[:space:]' < .github/php-version)"
          if [ "$pinned" != "${{ env.PHP_VERSION }}" ]; then
            echo "::error::.github/php-version is '$pinned' but ci.yml PHP_VERSION is '${{ env.PHP_VERSION }}'. Cloud sessions would provision a different series than CI tests."
            exit 1
          fi
      - uses: publicala/php-ci-static@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: ${{ env.PHP_INI_VALUES }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: composer test:lint # pint --test, rector --dry-run, prettier --check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: publicala/php-ci-static@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: ${{ env.PHP_INI_VALUES }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test:types # phpstan, level 8 with Larastan

  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: publicala/php-ci-static@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: ${{ env.PHP_INI_VALUES }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test:type-coverage # pest --type-coverage --min=100

  test:
    runs-on: ubuntu-latest
    # Tests run on PostgreSQL to match production (PlanetScale Postgres).
    # Local dev and hosted Claude Code sessions stay on SQLite by choice.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: logralo
          POSTGRES_USER: logralo
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # .env.example ships the SQLite default for local dev. Laravel loads it
      # immutably, so real environment variables win — these point the suite at
      # the service container above.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: logralo
      DB_USERNAME: logralo
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      # No `extensions:` input, and none needed: the static build links every
      # extension in, pdo_pgsql included.
      - uses: publicala/php-ci-static@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov # pest --coverage needs a driver
          ini-values: ${{ env.PHP_INI_VALUES_COVERAGE }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # feature tests render @vite, which needs a manifest
      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate
      # `test:unit:full`, not `test:unit`: a gate has to execute every test, and
      # Pest reads its environment from a `--ci` argument rather than the usual
      # variables, so `locally()` in tests/Pest.php does not switch Tia off here
      # on its own. The `--no-tia` this script carries does.
      - run: composer test:unit:full

  # Browser tests get their own job: they are the slowest and the most likely
  # to flake, and isolating them keeps a red `test` job meaningful.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # sockets (pest-plugin-browser runs its own HTTP server) is linked into
      # the static build, so there is no extensions input to carry here.
      - uses: publicala/php-ci-static@v1
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: ${{ env.PHP_INI_VALUES }}
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No `npm run build` step: `composer test:browser` builds before it runs.
      # The in-process server serves `public/build` directly, so assets that do
      # not match the source are a wall of failures that reads like a
      # regression — and one owner of that invariant is what keeps a green CI
      # from meaning something different than a green local run.
      # The browser bundle is ~300 MB across chromium, its headless shell and
      # ffmpeg, and it is the same bundle on every run. Key it on
      # package-lock.json, which is where the playwright version is pinned.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # No `--with-deps`: it switches to root and runs apt, and the runner image
      # already carries every library chromium links against — that apt log
      # lists each one as "already the newest version". The only packages it
      # actually installs are CJK font sets this app never renders. It is also
      # the slowest thing in CI whenever azure.archive.ubuntu.com is having a
      # bad day: 17 kB/s on run 32267201880, which spent 20 of its 22 minutes
      # fetching those fonts while the browser suite itself ran in 36 seconds.
      # Put `npx playwright install-deps chromium` back only if a
      # missing-library error ever surfaces.
      - run: npx playwright install chromium
      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: composer test:browser

  # The single status check branch protection requires on `main`. Needs every
  # gate job. Runs on every PR and push, including when a gate fails or is
  # skipped (if: !cancelled()), but not when the run is cancelled, so a
  # cancelled run reports as cancelled instead of failed. Never path-filtered,
  # so it always reports a result.
  ci-success:
    if: ${{ !cancelled() }}
    needs: [lint, static-analysis, type-coverage, test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
