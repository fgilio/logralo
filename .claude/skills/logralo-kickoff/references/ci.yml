# CI for Logralo: a public personal repo on GitHub-hosted runners (public repos
# get unlimited GitHub-hosted minutes, so ubuntu-latest is the right call here).
#
# Laravel Cloud auto-deploys every push to `main`, so this workflow has no
# deploy job. Its role is to keep `main` deployable: it runs the same gates
# as Lefthook and Composer (lint, static analysis, type coverage, tests),
# then a single `ci-success` aggregate job. Point branch protection at
# `ci-success` only; adding or renaming a gate job never touches the
# protection rule, just keep the job in `ci-success`'s `needs:` list.
#
# Flux Pro auth: the repo is public, so auth.json is NOT committed. Each job
# that runs `composer install` writes the http-basic credentials from the
# FLUX_USERNAME and FLUX_LICENSE_KEY repository secrets first. Known
# limitation: fork PRs cannot read secrets, so `composer install` fails for
# external contributors until a maintainer reruns the workflow from a branch.
#
# Pest's Tia engine is deliberately inert here: tests/Pest.php configures it
# `locally()`, so it does not auto-activate on CI, and no job below passes an
# explicit `--tia` (which would override that guard). Gates therefore always
# execute the full suite and never trust a cached replay. The shared baseline
# is recorded by the separate tia-baseline.yml workflow, which gates nothing —
# keep it out of `ci-success`'s `needs:` list.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One run per ref. Superseded PR runs cancel for fast feedback. Runs on
  # `main` never cancel each other, so every commit gets a complete
  # `ci-success`.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Keep in sync with the `php` constraint in composer.json.
  PHP_VERSION: '8.5'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: composer test:lint # pint --test, rector --dry-run, prettier --check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: memory_limit=512M
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test:types # phpstan, level 8 with Larastan

  type-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - run: composer test:type-coverage # pest --type-coverage --min=100

  test:
    runs-on: ubuntu-latest
    # Tests run on PostgreSQL to match production (PlanetScale Postgres).
    # Local dev and hosted Claude Code sessions stay on SQLite by choice.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: logralo
          POSTGRES_USER: logralo
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # .env.example ships the SQLite default for local dev. Laravel loads it
      # immutably, so real environment variables win — these point the suite at
      # the service container above.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: logralo
      DB_USERNAME: logralo
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql # not in setup-php's default set
          coverage: pcov # pest --coverage needs a driver
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - run: composer install --no-progress --prefer-dist --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # Vite assets for feature and browser tests
      # Drop this step if the app has no browser tests (pest-plugin-browser).
      - run: npx playwright install chromium
      - name: Prepare the app
        run: |
          cp .env.example .env
          php artisan key:generate
      # `test:unit:full`, not `test:unit`: a gate has to execute every test, and
      # Pest reads its environment from a `--ci` argument rather than the usual
      # variables, so `locally()` in tests/Pest.php does not switch Tia off here
      # on its own. The `--no-tia` this script carries does.
      - run: composer test:unit:full

  # The single status check branch protection requires on `main`. Needs every
  # gate job. Runs on every PR and push, including when a gate fails or is
  # skipped (if: !cancelled()), but not when the run is cancelled, so a
  # cancelled run reports as cancelled instead of failed. Never path-filtered,
  # so it always reports a result.
  ci-success:
    if: ${{ !cancelled() }}
    needs: [lint, static-analysis, type-coverage, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
